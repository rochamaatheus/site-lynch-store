; ---------------------------------------------------------------------------
; Lynch Store - ajustes de PHP por pasta (Hostinger le este arquivo na raiz do
; public_html; mudancas levam ate 5 minutos para valer, pelo cache do PHP).
;
; So entram aqui diretivas que o PHP aceita em .user.ini (PHP_INI_PERDIR/ALL).
; expose_php, allow_url_fopen, allow_url_include, disable_functions,
; file_uploads e max_file_uploads sao PHP_INI_SYSTEM: o PHP ignora essas linhas
; aqui. Elas ficam no hPanel (Avancado > Configuracao do PHP), conforme
; docs/SEGURANCA.md.
; ---------------------------------------------------------------------------

; Erros nunca na tela do visitante; o log vai para a pasta privada (config.php)
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
zend.exception_ignore_args = On

; Sessao (config.php repete estas linhas; aqui valem antes de qualquer codigo)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200

; Tamanho de envio: fotos de ate 5 MB cada, varias por vez; planilha de ate 3 MB
upload_max_filesize = 12M
post_max_size = 16M
max_input_vars = 1000
max_input_time = 60
max_execution_time = 60
memory_limit = 256M

; open_basedir prende o PHP a pasta da conta. So ative depois de conferir no
; hPanel o caminho real e a pasta de sessoes/temporarios da hospedagem, senao o
; upload e o login param. Exemplo (ajuste u000000000 e o dominio):
; open_basedir = /home/u000000000/domains/SEU-DOMINIO/:/tmp/:/var/lib/php/session/
